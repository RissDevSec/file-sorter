[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "file-sorter"
version = "0.1.0"
description = "A tiny, dependency-free CLI that sorts files into category folders by extension."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Faris Arhana", email = "ahmadfarisarhana@gmail.com" },
]
keywords = [
    "cli",
    "downloads",
    "file-organizer",
    "productivity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
file-sorter = "file_sorter.cli:main"

[project.urls]
Homepage = "https://github.com/RissDevSec/file-sorter"
Repository = "https://github.com/RissDevSec/file-sorter"
Issues = "https://github.com/RissDevSec/file-sorter/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
